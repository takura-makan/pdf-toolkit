name: Deploy to GAS

on:
  push:
    branches:
      - main  # mainブランチに変更が保存されたら自動で動く

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create clasprc.json (鍵のセット)
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Deploy to GAS (GASへ送信)
        run: |
          cd clasp
          clasp push -f